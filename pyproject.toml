[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ciandlithe"
version = "0.1.0"
description = "British Isles civil-litigation open-source OSINT data platform"
readme = "README.md"
license = { text = "BUSL-1.1 (per LICENSE.md)" }
requires-python = ">=3.12"
authors = [
    { name = "Cian Mac an Déisigh Uí Liatháin", email = "cianmacliathain@gmail.com" },
]
keywords = [
    "british-isles",
    "civil-litigation",
    "medical-malpractice",
    "osint",
    "dlt",
    "baml",
    "dagster",
    "cocoindex",
    "motherduck",
    "ducklake",
    "lancedb",
    "tanstack-start",
    "convex",
    "ag-ui",
    "copilotkit",
    "courts-ie",
    "irishstatutebook",
    "nicts",
    "scotcourts",
    "judiciary-uk",
    "wrc",
    "piab",
    "hse",
    "nhs",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Healthcare Industry",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Sociology",
]

dependencies = [
    "dlt[duckdb]>=1.4.0",
    "dagster>=1.13.0",
    "baml-py>=0.223.0",
    "cocoindex>=1.0.14",
    "lancedb>=0.20.0",
    "duckdb>=1.4.0",
    "pydantic>=2.10.0",
    "structlog>=25.0.0",
    "pyyaml>=6.0.0",
    "langfuse>=4.0.0",
    # Per the openspec/changes/ciandlithe-toolchain-repair-v1 change
    # (Phase 1 — toolchain repair): pymupdf is used by the WO-1 corpus
    # ingest pipeline. Pin now so `uv run --python 3.12` resolves
    # cleanly.
    "pymupdf>=1.24",
    # Per the 2026-08-24-dlt-sources-to-multi-repo-scaffold-v1 change
    # (Phase 2.6 — destination-versioning contract): cianfhoghlaim is
    # the cross-cutting hub for the canonical DLT destinations
    # (destinations_cianfhoghlaim + ducklake factory + multischema
    # support). The sister repos depend on it via this loose pin so
    # any destination-version bump on cianfhoghlaim flows to the
    # sister via `mise run ciandlithe:dlt:destination-validate` (the
    # downgrade gate).
    #
    # NOTE: The sister repos are STANDALONE today (no
    # [tool.uv.sources]); the wholesale-copy pattern means the actual
    # import resolution happens via the local duplicates, not via a
    # real Python package dependency. Per the v2 plan + the parent
    # change's task §21.3b, the destination-versioning contract is
    # gated by the per-sister `mise run <repo>:dlt:destination-validate`
    # CI workflow (NOT by a pip pin). If cianfhoghlaim becomes a uv
    # workspace member in a future phase, replace the CI gate with a
    # `[tool.uv.sources]` workspace declaration.
    "mlflow>=2.18.0",
    # motherduck is published as a 0.0.0 placeholder on PyPI; the
    # real client ships via the MotherDuck account SDK. Moved to the
    # `lakehouse` extras group (ciandlithe[lakehouse]) so the default
    # `uv run --python 3.12` doesn't try to resolve a phantom version.
    # WO-2 (ciandlithe-lakehouse-medallion-v1) installs the real client.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.12.0",
    "mypy>=1.13.0",
    # `openspec` and `motherduck` are NOT installable via PyPI:
    #   - openspec ships as a `bunx openspec` binary (or via `npm i -g @fission-ai/openspec`)
    #   - motherduck ships as the MotherDuck account SDK (not on PyPI)
    # The `mise run` tasks invoke them via the mise [tools] section
    # (per ciandlithe-toolchain-repair-v1) — bun for openspec,
    # direct binary install for motherduck. They do not need to be
    # in any [project.optional-dependencies] group.
    #
    # motherduck is intentionally NOT in any pip-resolvable group (PyPI
    # publishes it as 0.0.0 — a placeholder). WO-2
    # (ciandlithe-lakehouse-medallion-v1) installs the real client
    # from the MotherDuck account SDK and re-introduces the lakehouse
    # dependency-group at that point.
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "EM", "RET", "SIM", "PTH", "ERA"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["ciandlithe"]

# -----------------------------------------------------------------------------
# Cross-repo Python source map — REMOVED.
#
# Ciandlithe is a STANDALONE iteration of the project. It does NOT
# consume any files from Cianfhoghlaim or Cianchosaint at runtime.
# The relevant Cianfhoghlaim + Cianchosaint assets (DLT sources + BAML
# schemas + CocoIndex flows + agents framework + web framework + IaC
# stacks + skills) are wholesale-copied into Ciandlithe via the
# `openspec/changes/ciandlithe-repo-foundation-v1` openspec change,
# then renamed to the ciandlithe namespace and refactored for the
# civil-litigation / medical-malpractice domain.
#
# This file intentionally has NO [tool.uv.sources] section.
# -----------------------------------------------------------------------------