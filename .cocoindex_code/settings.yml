# Explicit top-priority patterns for the agent discovery Apps (added 2026-06-30).
# The agent_registry v1 App reads `opencode.json` (single file at repo root).
# The agents_md v1 App reads the 6 canonical AGENTS.md files.
# The apple_photos v1 Apps scan leabharlann/photos/ + the GeoParquet output.
# These patterns ensure the new v1 Apps pick up the right files first on
# incremental re-index.
priority_patterns:
- 'AGENTS.md'
- '**/oideachais/AGENTS.md'
- '**/meaisinfhoghlaim/AGENTS.md'
- '**/tuatha/AGENTS.md'
- '**/croilar/AGENTS.md'
- '**/bonneagar/AGENTS.md'
- 'opencode.json'
- 'leabharlann/photos/**'
