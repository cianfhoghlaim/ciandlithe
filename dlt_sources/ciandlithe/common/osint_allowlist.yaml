# =============================================================================
# CIANDLITHE — OSINT source URL allowlist
# =============================================================================
#
# Per LICENSE.md §5.1: every DLT source file at `dlt_sources/ciandlithe/**`
# MUST reference only URLs listed in this file. The CI gate `mise run
# lint:license` enforces this at merge time.
#
# Every URL MUST point at a public-facing page of a body named in
# `LICENSE.md §3.1–§3.7`. Foreign bodies are subject to the 3-step gate
# (LICENSE.md §6).
#
# Format:
#   - url: the canonical source URL (https only)
#   - jurisdiction: one of IRELAND / NI / SCOTLAND / WALES / ENGLAND / JERSEY / GUERNSEY / IOM / UK_WIDE
#   - body: the licence body name (per §3.1–§3.7)
#   - cohort: one of the 7 BLIP v1 cohorts
#   - source_family: the dlt_sources family (e.g. courts_ie, irish_statute_book, hse, nhs_england, nidirect, scotcourts, judiciary_uk, gmc)
#
# This file is the canonical source-of-truth. Updates MUST be made via PR
# + openspec change (the `ciandlithe-dlt-source-policy-v1` follow-up).
# =============================================================================

allowlist_version: "1.0.0"
last_updated: "2026-08-24"
change_date: "2031-08-24"

