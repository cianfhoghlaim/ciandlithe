# CIANDLITHE build of stagehand stack. Original: n/a (new build). Licence: BUSL-1.1 (per LICENSE.md)
#
# =============================================================================
# STAGEHAND - Locket Sidecar Overlay
# =============================================================================
# Per the Locket Sidecar Contract in infrastructure-stacks/spec.md:
#   * user 65532:65532 (nobody:nogroup)
#   * no-new-privileges: true
#   * cap_drop: ALL
#   * read_only: true
#   * tmpfs mode 700 uid=65532 gid=65532
#
# The Locket sidecar resolves the `infisical://dev-baile/ciandlithe/stagehand/*`
# references in ./secrets.env and writes the resolved values to a tmpfs volume
# mounted at /run/secrets/locket in BOTH containers. The stagehand container
# then `env_file`s the resolved file on every container start.
# =============================================================================

services:
  locket:
    image: ciandlithe/locket:local
    build:
      context: ../locket
      dockerfile: Dockerfile
    container_name: stagehand-locket
    restart: unless-stopped
    environment:
      LOCKET_FALLBACK_FILE: /run/secrets/locket/env-fallback.env
      LOCKET_BIND_ADDR: 0.0.0.0:9090
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # /run/secrets/locket is mounted via the `stack-secrets` named volume
    # (declared below as a tmpfs with mode 700 uid=65532) — the same mount
    # is shared with the stagehand container.
    tmpfs:
      - /tmp:size=8m,mode=1777
    command:
      - "--provider=infisical"
      - "--infisical-client-id=$${INFISICAL_CLIENT_ID}"
      - "--infisical-client-secret=file:/run/secrets/infisical_secret"
      - "--infisical-default-environment=$${INFISICAL_ENVIRONMENT:-dev}"
      - "--infisical-default-project-id=$${INFISICAL_PROJECT_ID:-}"
      - "--infisical-url=$${INFISICAL_URL:-http://infisical-backend:8080}"
      - "--map=/templates:/run/secrets/locket"
      - "--mode=$${LOCKET_MODE:-watch}"
      - "--http-addr=0.0.0.0:9090"
    secrets:
      - infisical_secret
    volumes:
      - ./secrets.env:/templates/secrets.env:ro
      - ${INFISICAL_FALLBACK_FILE:-/run/secrets/locket/env-fallback.env}:/run/secrets/locket/env-fallback.env:ro
      - stack-secrets:/run/secrets/locket
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "/locket", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - stagehand-net

  # The stagehand service is MERGED from compose.yaml — we only override
  # the dependency on locket (added here) + the secret-mounted volume +
  # the env_file override that points at the Locket-resolved tmpfs.
  stagehand:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - stack-secrets:/run/secrets/locket:ro
    environment:
      # Override the env_file path to the resolved secrets
      - LOCKET_SECRETS_PATH=/run/secrets/locket/secrets.env
    env_file:
      - /run/secrets/locket/secrets.env

secrets:
  infisical_secret:
    file: $${INFISICAL_SECRET_FILE:-../../infisical_secret}

volumes:
  stack-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=65532,gid=65532,mode=700

networks:
  stagehand-net:
    name: stagehand-net
    external: true
